  #Google
  google_sign_in: ^6.2.1
  google_fonts: ^6.1.0
  google_mlkit_face_detection: 0.11.1

  #Splash screen
  flutter_native_splash: ^2.4.4
  # Utils
  image_picker: ^1.1.1
  file_picker: ^8.0.5
  intl: ^0.19.0
  shared_preferences: ^2.0.15
  url_launcher: ^6.3.0
  table_calendar: ^3.0.9
  provider: ^6.1.4
  http: ^1.4.0
  flutter_dotenv: ^5.2.1
  flutter_secure_storage: ^9.0.0
  get: ^4.6.6
  logger: ^2.1.0
  cached_network_image: ^3.4.1
  camera: ^0.10.0+5
  pull_to_refresh: ^2.0.0
  hive: ^2.2.3
  localization: ^2.1.1
  flutter_gen_runner: ^5.12.0
  build_runner: ^2.10.1
  flutter_svg: ^2.2.1
  auto_size_text: ^3.0.0
  flutter_rounded_date_picker: ^3.0.4
  calendar_date_picker2: ^2.0.1
  bot_toast: ^4.1.3
  loading_overlay_pro: ^2.1.1
  local_auth: ^2.3.0
  encrypt: ^5.0.3
  app_settings: ^6.1.1
  device_info_plus: ^11.3.0
  flutter_localization: ^0.3.3
  fluttertoast: ^8.2.8
  firebase_auth: ^6.1.1
  firebase_core: ^4.2.0
  flutter_launcher_icons: ^0.14.4
  percent_indicator: ^4.2.3
  local_auth_android: ^1.0.52
  local_auth_darwin: ^1.6.0
  path_provider: ^2.1.5
  image: ^4.5.4
  google_mlkit_commons: ^0.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0


flutter:

  uses-material-design: true
  assets:
    - assets/fonts/
    - assets/icons/
    - assets/images/
    - assets/locales/
flutter_icons:
  android: true
  ios: true
  image_path: "images/logo.png"
